name: Build & deploy to GitHub Pages

# Compiles the public 1-page CV (LaTeX → docs/assets/cv.pdf), builds the MkDocs
# portfolio, and deploys. No gate, no secrets: tailored applications live in
# applications/ (outside docs/) and are never published; their PDFs go to Drive.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Public CV PDF: compile latex/resume.tex (pdfLaTeX) → doc-pages/assets/cv.pdf.
      - name: Compile public CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: resume.tex
      - name: Stage CV PDF into doc-pages
        run: cp latex/resume.pdf doc-pages/assets/cv.pdf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -e .

      - name: Build site
        run: mkdocs build --clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
