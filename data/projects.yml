# Structured project catalogue for relevance ranking (engine/rank.py).
# Real projects with real repo links. Each entry
# carries `tags` and `stack` used to score against a JobSpec; `summary` is the
# one-line fallback for a tailored CV's Projects section. `doc` points at the public
# write-up under docs/projects/.
#
#   highlights: [..]  optional list of role-neutral, truthful facts (verbatim from
#             master-cv.md "Selected Work"). When present, the CV renderer re-angles
#             a subset of these to the target role instead of copying `summary`, so
#             the same project reads as ETL for a data role or observability for a
#             devops role. Absent -> the renderer falls back to `summary`.
#
# Optional ranking knobs per project:
#   weight:   float, default 1.0. Multiplies the project's relevance score so a
#             flagship outranks an incidental match (see data/ranking.yml).
#   clusters: [..]  override the taxonomy-derived clusters (data/taxonomy.yml)
#             for the rare project the tag-derivation mislabels. Usually omit.

projects:
  - id: irs
    name: "IRS Platform (Stealth)"
    weight: 1.4
    doc: projects/irs.md
    url: ""
    summary: "Distributed Go microservices on native NATS (JetStream + KV) and gRPC, with MCP tooling for LLM agents and a Hatchet-orchestrated ETL pipeline."
    # Role-neutral facts (verbatim from master-cv.md "Selected Work"). The CV
    # renderer re-angles a subset of these to the target role; never invent beyond them.
    highlights:
      - "Built Go microservices with gRPC and gRPC-Gateway using Protobuf-first APIs and Buf tooling."
      - "Migrated the platform off Dapr to native NATS JetStream (messaging), NATS KV (session state), and direct gRPC."
      - "Built an MCP (Model Context Protocol) integration exposing the platform to LLM agents as declarative, hot-reloadable tools via a config-driven toolbox server."
      - "Built a per-user authenticated browser-session service (Playwright) with gateway consistent-hashing and an AES-256-GCM credential vault."
      - "Built a best-effort ETL side-channel into PostgreSQL (sqlc), Dgraph, and DocumentDB, orchestrated by Hatchet with declarative routing; verified by a Ginkgo E2E gate."
      - "Integrated multiple bot-protected third-party vendors via an adaptor/anti-corruption contract with CUE-based schema mapping."
      - "Deployed with Kubernetes, kustomize, Skaffold, Cilium, and external-dns."
    domains: ["backend", "distributed-systems", "platform"]
    tags: ["go", "distributed", "microservices", "grpc", "nats", "event-driven", "mcp", "kubernetes", "etl", "messaging", "backend"]
    stack: ["Go", "gRPC", "NATS JetStream", "NATS KV", "Hatchet", "PostgreSQL", "Dgraph", "Kubernetes", "Cilium", "CUE", "MCP"]

