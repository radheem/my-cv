    url: "https://github.com/radheem/my-notebook"
    summary: "Self-hosted RAG document-intelligence service: durable Hatchet ingestion, local llama.cpp inference, pgvector semantic search, NATS JetStream progress streaming on a k3d homelab."
    highlights:
      - "Durable, retryable document-ingestion pipeline with Hatchet (extract → chunk → embed → summarize → index), per-step timeouts and retries that survive worker crashes."
      - "Real-time progress streaming over NATS JetStream + SSE (durable stream + KV current-state)."
      - "All inference kept local and private via two llama.cpp servers (chat + embeddings) behind an OpenAI-compatible API."
      - "Vector search with pgvector (HNSW, cosine); deployed cloud-native on k3d with cert-manager TLS and ExternalDNS."
    domains: ["ml", "backend", "platform"]
    tags: ["python", "rag", "llm", "ml", "ai", "pgvector", "fastapi", "hatchet", "nats", "kubernetes", "vector-search", "data", "backend"]
    stack: ["Python", "FastAPI", "Hatchet", "NATS JetStream", "llama.cpp", "PostgreSQL", "pgvector", "Next.js", "Kubernetes (k3d)", "OpenTelemetry"]

