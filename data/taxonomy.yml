# Controlled vocabulary for the relevance ranker (engine/rank.py).
#
# Shared by PROJECTS (data/projects.yml) and JOB applications so both get
# classified into the same named CLUSTERS — an agent can read a job's clusters
# (written into docs/jobs/<slug>/index.md front matter) and pull the correlating
# projects directly, instead of relying on brittle token overlap.
#
# This file is OPTIONAL. If it is absent the ranker falls back to plain
# token-overlap matching (no aliasing, no clusters) — exactly the original
# behavior. Edit it to teach the ranker your synonyms and domains.

# Alias normalization: every variant token (right) is rewritten to its canonical
# form (left key) before matching, so k8s / golang / postgres all line up with
# kubernetes / go / postgresql. Variants must be single lowercase tokens, and a
# variant may belong to only one canonical (the loader raises on a collision).
aliases:
  kubernetes: [k8s, k3s, k3d]
  go: [golang]
  postgresql: [postgres, pgsql]
  javascript: [js, vanilla-js]
  typescript: [ts]

# Clusters: named groups of canonical tags. A project or job belongs to a cluster
# when its (alias-normalized) token set intersects that cluster's tags.
clusters:
  information-management:
    tags: [database, sql, postgresql, data, persistence, etl, analytics, charts, scrapers, webscraping, transactional, datalake, design]
  ai-ml:
    tags: [ml, ai, llm, rag, mlops, kubeflow, kserve, pgvector, vector-search, inference, model-training, deployment, agentic, agents, training]
  platform-engineer:
    tags: [kubernetes, cilium, ebpf, helm, docker, gitops, devops, platform, sre, networking, dns, cloud, observability, monitoring, metrics, tracing, reliability]
  distributed-system:
    tags: [distributed, microservices, grpc, nats, event-driven, messaging, mcp, backend, fullstack, web, react, node, api, architecture]
  telecommunication:
    tags: [5g, oran, telecom, sdn, multus, open5gs, radio, ran, wireless]
  fullstack-engineer:
    tags: [fullstack, web, frontend, react, node, nestjs, typescript, javascript, ng, angular, next, vue, django, fastapi, css, html, responsive]
