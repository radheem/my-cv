# cv-tailor ingest service. Secrets and provider/model config come from .env (env_file) —
# never hardcoded here. vault/ is the private, gitignored runtime volume.
services:
  ingest:
    build: .
    image: my-cv-ingest:latest
    # Run as the host user so vault/ files aren't owned by a foreign uid. The Makefile exports
    # DOCKER_UID/DOCKER_GID = your id -u/-g. Outside make: `DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose ...`.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    env_file: .env
    environment:
      DISPLAY: ":99"
      LINKEDIN_USER_DATA_DIR: /app/vault/profile
      CV_TAILOR_VAULT: /app/vault
      SCREEN_GEOMETRY: 1440x900x24
      HOME: /tmp   # the host uid has no home in the image; Chromium needs a writable HOME
      VNC_PASSWORD: ${VNC_PASSWORD:-}   # set to require a password (recommended over Tailscale)
      # LINKEDIN_PACE: "1.2"   # raise to slow login pacing further on a touchy account
    volumes:
      - ./vault:/app/vault       # browser profile, captured JDs, challenge screenshots
      - ./data:/app/data:ro      # persona (John Doe sample; mount real data ro if ever used)
    ports:
      # VNC bind address. Default localhost (use an SSH tunnel). To reach it directly over
      # Tailscale, bind to the tailnet IP: `VNC_BIND=<tailnet-ip> make docker-ingest`.
      # Do NOT use 0.0.0.0 — that also exposes it on the box's public interface.
      - "${VNC_BIND:-127.0.0.1}:5900:5900"
    stdin_open: true             # interactive OTP prompt (StdinResolver)
    tty: true
    # extra_hosts:               # uncomment if the generation endpoint host needs a static map
    #   - "internal-llm-host:10.0.0.0"
