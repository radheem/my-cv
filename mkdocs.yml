site_name: Radheem Bin Razi
site_description: Distributed Systems & Cloud-Native Engineer — portfolio, projects, and CV
site_author: Radheem Bin Razi
site_url: https://radheem.github.io/my-cv/
docs_dir: doc-pages

theme:
  name: material
  font:
    text: DM Sans
    code: JetBrains Mono
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radheem
    - icon: fontawesome/solid/envelope
      link: mailto:sheikh.radheem@gmail.com

# Job applications live OUTSIDE docs/ (in applications/) and are never built into
# the public site — only this portfolio is published.

validation:
  nav:
    omitted_files: ignore

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
      - IRS Platform (Stealth): projects/irs.md
      - Second Brain (Document RAG): projects/second-brain.md
      - cv-tailor (Agentic Job-Hunting): projects/cv-tailor.md
      - HA K3s Cluster Platform (k3d + Cilium): projects/k3d.md
      - Homelab (Zero-Touch LAN DNS): projects/homelab.md
      - O-RAN AIML Framework: projects/oran-aiml.md
      - O-RAN Testbed (Docker · OCUDU + RIC): projects/oran-testbed.md
      - 5G srsRAN Testbed (Kubernetes): projects/5g-testbed.md
      - Infinite Stickman (Arcade Runner): projects/stickman.md
      - Sheet Dashboard (Google Sheets): projects/csv-dashboard.md
      - Gitpress (Zero-Server Blog): projects/gitpress.md
  - CV: cv.md
  - Certificates: certificates.md
