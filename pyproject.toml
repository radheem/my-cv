[project]
name = "cv-tailor"
version = "0.1.0"
description = "Generate job-tailored CVs + cover letters (LaTeX), publish a public MkDocs portfolio to GitHub Pages, store tailored PDFs in Google Drive, and track applications in git."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Runtime split in two:
#  - public site build (CI-safe, no API key):    mkdocs-material, pyyaml, markdown
#  - content generation (local only, needs key): anthropic, jinja2, (playwright optional)
# Tailored PDFs are rendered with LaTeX (latex/*.cls via scripts/build-application.sh;
# local latexmk or the texlive/texlive Docker image) — no Python PDF dependency.
dependencies = [
    "mkdocs-material>=9.5",
    "pyyaml>=6",
    "markdown>=3.6",
    "duckdb>=1.0.0",
    "pytz",
]

[project.optional-dependencies]
generate = [
    "anthropic>=0.40",
    "jinja2>=3.1",
]
ollama = [
    "openai>=1.40",
]
fetch = [
    "playwright>=1.45",
    "playwright-stealth>=1.0.6",
    "python-dotenv>=1.0",
]
screenshot = [
    "pixelrag",
    "openai>=1.40",
]
mcp = [
    "mcp[cli]>=1.25.0,<2.0.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
cv-tailor = "engine.cli:main"
cv-tailor-mcp = "engine.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]

[tool.uv.sources]
pixelrag = { path = "PixelRAG", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vault", ".venv", "site", "build"]
